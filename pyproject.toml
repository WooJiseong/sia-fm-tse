[tool.pyright]
typeCheckingMode = "basic"
reportPrivateImportUsage = "none"

[tool.uv.sources]
torch = { index = "pytorch" }
torchaudio = { index = "pytorch" }
sia-fm-tse = { workspace = true, editable = true }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.workspace]
members = [
    ".",
    ".",
    ".",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # Line too long
]

[dependency-groups]
dev = [
    "sia-fm-tse",
]
