[project]
name = "sia-fm-tse"
version = "0.1.0"
description = "Generative Traget Speaker Extraction with Flow Matching"
readme = "README.md"
requires-python = "==3.11*"
dependencies = []

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # Line too long
]

[tool.ruff.lint.isort]
known-first-party = ["src"]
